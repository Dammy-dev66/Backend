<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Status - Finbar B. Elite Tutoring</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page">
    <header class="brand">
      <a class="brand-logo-lockup" href="/" aria-label="Finbar B. Elite Tutoring">
        <img class="brand-logo-full" src="/assets/finbar-horizontal-logo-aligned.png" alt="Finbar B. Elite Tutoring">
      </a>
    </header>
    <main class="panel">
      <p class="eyebrow" id="confirmEyebrow">Checking payment</p>
      <h1 id="confirmTitle">Checking your payment.</h1>
      <p class="lede" id="confirmLead">Please wait while we confirm the payment and booking.</p>
      <div class="summary" id="confirmSummary"></div>
      <section class="meeting-details hidden" id="meetingDetails" aria-label="Online lesson details">
        <p class="meeting-details__eyebrow">ONLINE CLASSROOM</p>
        <h2>VOOV / Tencent Meeting</h2>
        <p>Your lesson will take place online. Use the link below to join.</p>
        <a id="meetingJoinLink" href="https://voovmeeting.com/p/7360852010" target="_blank" rel="noopener noreferrer">Join the VOOV meeting</a>
        <p class="meeting-details__id">Tencent Meeting ID: <strong id="meetingId">736-085-2010</strong></p>
      </section>
      <p class="field-error" id="confirmError"></p>
      <a class="btn-link hidden" id="bookLink" href="/">Book again</a>
    </main>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const saved = (() => {
      try {
        return JSON.parse(sessionStorage.getItem("finbarReturnSelection") || "{}");
      } catch {
        return {};
      }
    })();
    const eyebrow = document.getElementById("confirmEyebrow");
    const title = document.getElementById("confirmTitle");
    const lead = document.getElementById("confirmLead");
    const summary = document.getElementById("confirmSummary");
    const error = document.getElementById("confirmError");
    const bookLink = document.getElementById("bookLink");
    const meetingDetails = document.getElementById("meetingDetails");
    const meetingJoinLink = document.getElementById("meetingJoinLink");
    const meetingId = document.getElementById("meetingId");

    const subject = params.get("subject") || saved.subject || "your lesson";
    const format = params.get("format") || saved.format || "";
    const tier = params.get("tier") || saved.tier || "";
    const appointmentTypeID = params.get("appointmentTypeID") || saved.appointmentTypeID || "";
    const email = params.get("email") || saved.packageEmail || "";
    const backUrl = params.get("backUrl") || saved.backUrl || localStorage.getItem("finbarBackUrl") || "";
    const orderID = params.get("orderID") || saved.orderID || "";
    const productID = params.get("productID") || "";
    const bookingLink = params.get("bookingLink") || saved.bookingLink || "";
    const couponCode = params.get("couponCode") || "";
    const source = params.get("source") || "stripe";

    function sameOriginLink(value) {
      if (!String(value || "").trim()) return null;
      try {
        const target = new URL(String(value || ""), location.origin);
        return target.origin === location.origin ? target : null;
      } catch {
        return null;
      }
    }

    function prepareBookAgain(verifiedSubject) {
      const safeBookingLink = sameOriginLink(bookingLink);
      if (safeBookingLink) {
        bookLink.href = safeBookingLink.toString();
        return;
      }
      const target = new URL("/", location.origin);
      if (verifiedSubject) target.searchParams.set("subject", verifiedSubject);
      if (format) target.searchParams.set("format", format);
      if (tier) target.searchParams.set("tier", tier);
      if (appointmentTypeID) target.searchParams.set("appointmentTypeID", appointmentTypeID);
      if (email) target.searchParams.set("email", email);
      if (backUrl) target.searchParams.set("backUrl", backUrl);
      if (orderID) target.searchParams.set("orderID", orderID);
      if (productID) target.searchParams.set("productID", productID);
      if (couponCode) target.searchParams.set("couponCode", couponCode);
      target.searchParams.set("source", source);
      target.searchParams.set("step", "1");
      bookLink.href = target.toString();
    }

    function renderSummary(data) {
      summary.replaceChildren();
      const course = document.createElement("strong");
      course.textContent = data.subject || "Your lesson";
      const lessonFormat = { oneToOne: "One student (1:1)", oneToTwo: "Two students (1:2)" }[data.format] || "Lesson";
      const lessonTier = { trial: "Trial class", single: "Single lesson", pack6: "6-class package", pack12: "12-class package" }[data.tier] || "";
      summary.append(course, document.createElement("br"), document.createTextNode(`${lessonFormat}${lessonTier ? ` · ${lessonTier}` : ""}`));
      if (Number.isFinite(data.totalPrice)) {
        summary.append(document.createElement("br"));
        const total = document.createElement("span");
        total.className = "muted";
        total.textContent = `Total: ${data.currency || "EUR"} ${data.totalPrice.toFixed(2)}`;
        summary.appendChild(total);
      }
    }

    function showUnverified(message) {
      eyebrow.textContent = "Payment status";
      title.textContent = "We could not verify this payment.";
      lead.textContent = message;
      error.textContent = "Please contact Finbar before trying to pay again.";
      bookLink.classList.add("hidden");
    }

    function showIncompleteCheckout() {
      eyebrow.textContent = "Payment status";
      title.textContent = "Payment has not been completed.";
      lead.textContent = "This confirmation page is available after Stripe confirms a payment. No payment has been taken from this page.";
      error.textContent = "Return to booking to continue securely.";
      prepareBookAgain(subject);
      bookLink.textContent = "Return to booking";
      bookLink.classList.remove("hidden");
    }

    async function checkPayment() {
      const sessionId = params.get("session_id") || "";
      if (!sessionId || sessionId === "{CHECKOUT_SESSION_ID}") {
        showIncompleteCheckout();
        return;
      }

      for (let attempt = 0; attempt < 5; attempt += 1) {
        let data;
        try {
          const response = await fetch(`/api/checkout-status?session_id=${encodeURIComponent(sessionId)}`, { cache: "no-store" });
          data = await response.json();
          if (!response.ok && data.paymentStatus !== "paid") throw new Error(data.error || "Payment status is unavailable.");
        } catch {
          showUnverified("We could not check Stripe right now. Your payment may still have succeeded.");
          return;
        }

        if (data.paymentStatus !== "paid") {
          showUnverified("Stripe has not confirmed a payment for this checkout session.");
          return;
        }
        renderSummary(data);
        error.textContent = "";
        bookLink.classList.add("hidden");
        eyebrow.textContent = "Payment received";

        if (data.fulfillmentStatus === "completed") {
          title.textContent = data.kind === "package" ? "Your package is ready." : "Your lesson is booked.";
          lead.textContent = data.emailDeliveryStatus === "failed"
            ? "Your payment and booking are recorded, but the confirmation email needs attention. Contact Finbar before trying to pay again."
            : data.kind === "package"
              ? "Check your email for your package code and booking details. Contact Finbar if they do not arrive."
              : "Check your email for the lesson details. Contact Finbar if they do not arrive.";
          if (data.kind !== "package") {
            try {
              const joinUrl = new URL(data.meetingPlatform?.joinUrl || "");
              if (joinUrl.protocol === "https:") {
                meetingJoinLink.href = joinUrl.toString();
                meetingId.textContent = data.meetingPlatform.meetingId || "";
                meetingDetails.classList.remove("hidden");
              }
            } catch {
              meetingDetails.classList.add("hidden");
            }
            prepareBookAgain(data.subject || subject);
            bookLink.classList.remove("hidden");
          }
          return;
        }
        if (data.fulfillmentStatus === "needs_review" || data.fulfillmentStatus === "unknown") {
          title.textContent = "Your payment needs a booking check.";
          lead.textContent = "Stripe received the payment, but we could not confirm the booking. Please contact Finbar before making another payment.";
          error.textContent = "Your payment should not be submitted again while this is reviewed.";
          return;
        }

        title.textContent = "Your payment was received.";
        lead.textContent = "We are finishing your booking details. Please wait here for confirmation.";
        if (attempt < 4) await new Promise((resolve) => setTimeout(resolve, 3000));
      }
      lead.textContent = "Your payment was received, but your booking is still being processed. Contact Finbar if a confirmation does not arrive.";
    }

    checkPayment();
  </script>
</body>
</html>
