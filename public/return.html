<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Complete - Finbar B. Elite Tutoring</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page">
    <header class="brand">
      <img class="brand-mark" src="https://i.imgur.com/HWaJZhQ.png" alt="Finbar B. Elite Tutoring">
      <div>
        <div class="brand-name">Finbar B.</div>
        <div class="brand-kicker">Elite Tutoring</div>
      </div>
    </header>
    <main class="panel">
      <p class="eyebrow">Payment complete</p>
      <h1 id="confirmTitle">Thanks - your payment was received.</h1>
      <p class="lede" id="confirmLead">Your confirmation email is on the way. The button below takes you straight to the sessions page if you want to book or add more times later.</p>
      <div class="summary" id="confirmSummary"></div>
      <p class="field-error" id="confirmError"></p>
      <a class="btn-link" id="bookLink" href="/">Go to sessions</a>
    </main>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const saved = (() => {
      try {
        return JSON.parse(sessionStorage.getItem("finbarReturnSelection") || "{}");
      } catch {
        return {};
      }
    })();
    const title = document.getElementById("confirmTitle");
    const lead = document.getElementById("confirmLead");
    const summary = document.getElementById("confirmSummary");
    const error = document.getElementById("confirmError");
    const bookLink = document.getElementById("bookLink");

    const subject = params.get("subject") || saved.subject || "your lesson";
    const format = params.get("format") || saved.format || "";
    const tier = params.get("tier") || saved.tier || "";
    const appointmentTypeID = params.get("appointmentTypeID") || saved.appointmentTypeID || "";
    const email = params.get("email") || saved.packageEmail || "";
    const backUrl = params.get("backUrl") || saved.backUrl || localStorage.getItem("finbarBackUrl") || "";
    const orderID = params.get("orderID") || saved.orderID || "";
    const productID = params.get("productID") || "";
    const certificate = params.get("certificate") || saved.certificate || "";
    const bookingLink = params.get("bookingLink") || saved.bookingLink || "";
    const couponCode = params.get("couponCode") || "";
    const totalPrice = params.get("totalPrice") || "";
    const source = params.get("source") || "stripe";
    const isPackageTier = /^pack/i.test(tier);
    const bookingStep = isPackageTier ? "2" : "1";

    const formatLabel = {
      oneToOne: "Tutor + one student",
      oneToTwo: "Tutor + two students"
    }[format] || format;

    if (bookingLink) {
      bookLink.href = bookingLink;
    } else {
      const target = new URL("/", location.origin);
      if (subject) target.searchParams.set("subject", subject);
      if (format) target.searchParams.set("format", format);
      if (tier) target.searchParams.set("tier", tier);
      if (appointmentTypeID) target.searchParams.set("appointmentTypeID", appointmentTypeID);
      if (email) target.searchParams.set("email", email);
      if (backUrl) target.searchParams.set("backUrl", backUrl);
      if (orderID) target.searchParams.set("orderID", orderID);
      if (productID) target.searchParams.set("productID", productID);
      if (certificate) target.searchParams.set("certificate", certificate);
      if (couponCode) target.searchParams.set("couponCode", couponCode);
      target.searchParams.set("source", isPackageTier ? "package" : source);
      target.searchParams.set("step", bookingStep);
      bookLink.href = target.toString();
    }
    bookLink.textContent = isPackageTier ? "Go to sessions" : "Book again";

    summary.innerHTML = `
      <strong>${subject}</strong><br>
      ${formatLabel || "Booking"}${tier ? ` - ${tier}` : ""}
      ${totalPrice ? `<br><span class="muted">Total: EUR ${Number(totalPrice).toFixed(2)}</span>` : ""}
    `;

    if (!params.get("session_id")) {
      error.textContent = "We could not confirm the payment session in this tab, but the button still takes you back to the custom flow.";
    }
  </script>
</body>
</html>
