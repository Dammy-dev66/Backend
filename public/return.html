<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Return To Booking - Finbar B. Elite Tutoring</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page">
    <header class="brand">
      <img class="brand-mark" src="https://i.imgur.com/HWaJZhQ.png" alt="Finbar B. Elite Tutoring">
      <div>
        <div class="brand-name">Finbar B.</div>
        <div class="brand-kicker">Elite Tutoring</div>
      </div>
    </header>
    <main class="panel">
      <p class="eyebrow">Payment Complete</p>
      <h1>Returning to booking.</h1>
      <p class="lede">We are sending you back to the custom booking page now so you can pick your time slots.</p>
      <a class="btn-link" id="bookLink" href="/">Continue to booking</a>
    </main>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const saved = (() => {
      try {
        return JSON.parse(sessionStorage.getItem("finbarReturnSelection") || "{}");
      } catch {
        return {};
      }
    })();
    const storedBackUrl = localStorage.getItem("finbarBackUrl") || "";

    function buildNextUrl() {
      const next = new URL("/", location.origin);
      ["subject", "format", "tier", "appointmentTypeID", "email", "orderID", "backUrl", "productID", "datetime", "appointmentCreated", "certificateCreated", "totalPrice", "couponCode"].forEach((key) => {
        if (params.has(key)) next.searchParams.set(key, params.get(key));
      });
      if (params.get("source")) {
        next.searchParams.set("source", params.get("source"));
      } else {
        next.searchParams.set("source", "acuity");
      }
      ["subject", "format", "tier", "appointmentTypeID", "packageEmail", "backUrl"].forEach((key) => {
        if (!next.searchParams.has(key) && saved[key]) next.searchParams.set(key, saved[key]);
      });
      if (!next.searchParams.has("backUrl") && storedBackUrl) {
        next.searchParams.set("backUrl", storedBackUrl);
      }
      return next;
    }

    async function finishStripeReturn() {
      const next = buildNextUrl();
      const sessionId = params.get("session_id");
      if (sessionId) {
        const res = await fetch("/api/stripe-complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: sessionId,
            subject: next.searchParams.get("subject") || params.get("subject") || "",
            format: next.searchParams.get("format") || params.get("format") || "",
            tier: next.searchParams.get("tier") || params.get("tier") || "",
            appointmentTypeID: next.searchParams.get("appointmentTypeID") || params.get("appointmentTypeID") || "",
            email: next.searchParams.get("email") || params.get("email") || "",
            productID: next.searchParams.get("productID") || params.get("productID") || "",
            backUrl: next.searchParams.get("backUrl") || params.get("backUrl") || "",
            datetime: next.searchParams.get("datetime") || params.get("datetime") || "",
            couponCode: next.searchParams.get("couponCode") || params.get("couponCode") || "",
            source: params.get("source") || "stripe"
          })
        });

        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok && data.url) {
          next.href = data.url;
        }
      }

      document.getElementById("bookLink").href = next.toString();

      const meta = document.createElement("meta");
      meta.httpEquiv = "refresh";
      meta.content = `0;url=${next.toString()}`;
      document.head.appendChild(meta);

      localStorage.setItem("finbarReturnTarget", next.toString());

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.location.replace(next.toString());
          window.opener.focus();
        } catch (error) {
          // The opener path is best-effort only.
        }
      }

      try {
        window.location.replace(next.toString());
      } catch (error) {
        // Meta refresh is the fallback if direct navigation is blocked.
      }

      setTimeout(() => {
        try {
          window.close();
        } catch (error) {
          // If the browser refuses to close the tab, the page should already be on the custom booking route.
        }
      }, 0);
    }

    finishStripeReturn().catch(() => {
      const next = buildNextUrl();
      document.getElementById("bookLink").href = next.toString();
      location.replace(next.toString());
    });
  </script>
</body>
</html>
